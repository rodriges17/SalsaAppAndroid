name: Android APK
on:
  push:
    branches: [main, codex/native-pwa-parity]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE*']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify signing restoration and fail-closed behavior
        run: python3 -m unittest discover -s tools -p test_signing.py
      - name: Verify shared PWA storage and exchange formats
        run: npm test
      - name: Select installed Chrome for bridge tests
        timeout-minutes: 5
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Verify Android bridge in Chromium
        run: npm run test:bridge
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-bridge-test-results
          path: test-results/

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK Platform 35
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore and verify permanent distribution signing key
        if: github.event_name != 'pull_request'
        env:
          STEPBYSTEP_SIGNING_KEYSTORE_BASE64: ${{ secrets.STEPBYSTEP_SIGNING_KEYSTORE_BASE64 }}
          STEPBYSTEP_SIGNING_PASSWORD: ${{ secrets.STEPBYSTEP_SIGNING_PASSWORD }}
          STEPBYSTEP_SIGNING_CERT_SHA256: ${{ vars.STEPBYSTEP_SIGNING_CERT_SHA256 }}
        run: python3 tools/prepare-signing.py
      - name: Compile Android APK and an earlier-version update fixture
        env:
          STEPBYSTEP_SIGNING_PASSWORD: ${{ secrets.STEPBYSTEP_SIGNING_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            test -n "$STEPBYSTEP_SIGNING_STORE"
            gradle --no-daemon :app:assembleDebug -PstepVersionCode=17
            mkdir -p "$RUNNER_TEMP/signing-upgrade"
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/signing-upgrade/upgrade-baseline.apk"
          fi
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify both APK signatures against the permanent certificate
        if: github.event_name != 'pull_request'
        env:
          STEPBYSTEP_SIGNING_CERT_SHA256: ${{ vars.STEPBYSTEP_SIGNING_CERT_SHA256 }}
        run: python3 tools/verify-apk-signing.py "$RUNNER_TEMP/signing-upgrade/upgrade-baseline.apk" app/build/outputs/apk/debug/app-debug.apk
      - name: Remove temporary private signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/stepbystep-signing"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: signing-upgrade-fixture
          path: ${{ runner.temp }}/signing-upgrade/upgrade-baseline.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: StepByStep-Android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  native-ui:
    runs-on: ubuntu-24.04
    needs: apk
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and fingerprint emulator runtime
        id: emulator-runtime
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' 'system-images;android-35;default;x86_64'
          fingerprint=$(cat "$ANDROID_HOME/emulator/package.xml" "$ANDROID_HOME/system-images/android-35/default/x86_64/package.xml" | sha256sum | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore clean emulator snapshot
        id: avd-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/avd/
          # Bump v1 when changing the AVD profile, RAM, cores or emulator options.
          key: avd-ubuntu24-x64-api35-default-pixel2-v1-${{ steps.emulator-runtime.outputs.fingerprint }}
      - name: Create clean emulator snapshot on cache miss
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          avd-name: stepbystep-ci
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 3072 -cores 2
          disable-animations: false
          script: echo 'Clean emulator snapshot prepared before installing any app.'
      # Save before running tests so cached AVDs never contain test/user data.
      - name: Save clean emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/avd/
          key: ${{ steps.avd-cache.outputs.cache-primary-key }}
      - uses: actions/download-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: StepByStep-Android-debug-apk
          path: ${{ runner.temp }}/distribution-apk
      - uses: actions/download-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: signing-upgrade-fixture
          path: ${{ runner.temp }}/signing-upgrade
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          STEPBYSTEP_VERIFY_UPGRADE: ${{ github.event_name != 'pull_request' }}
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          avd-name: stepbystep-ci
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim -memory 3072 -cores 2
          disable-animations: true
          script: bash tools/run-signed-native-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-test-results
          path: |
            app/build/reports/androidTests/
            app/build/native-diagnostics/
            app/build/outputs/androidTest-results/

  # Retain the existing required check name, including all parallel test jobs.
  build:
    if: always()
    needs: [bridge, apk, native-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all Android checks
        env:
          BRIDGE_RESULT: ${{ needs.bridge.result }}
          APK_RESULT: ${{ needs.apk.result }}
          NATIVE_RESULT: ${{ needs.native-ui.result }}
        run: test "$BRIDGE_RESULT" = success && test "$APK_RESULT" = success && test "$NATIVE_RESULT" = success
